# sdlc — Stage 2 automation: an accepted intent.md triggers the requirements & design pass.
# When a push to the default branch changes an intent file to `status: approved`, Claude runs the playbook's Stage 2
# prompt with the organization's skills loaded (.claude/skills/) and opens a PR with spec/<slug>.md.
# The product owner's first involvement is the review of that PR. Secrets: ANTHROPIC_API_KEY (init.sh --auth api) or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (init.sh --auth oauth, subscription billing).
name: sdlc spec on approved intent
on:
  push:
    branches: [{{default_branch}}]
    paths: ['{{intent_dir}}/**/*.md']
permissions:
  contents: write
  pull-requests: write
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Find intents that just became approved
        id: find
        run: |
          set -e
          approved=""
          for f in $(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- '{{intent_dir}}/*.md'); do
            [ -f "$f" ] || continue
            grep -qE '^status:[[:space:]]*approved' "$f" || continue
            git show ${{ github.event.before }}:"$f" 2>/dev/null | grep -qE '^status:[[:space:]]*approved' && continue
            approved="$approved $f"
          done
          echo "files=$approved" >> "$GITHUB_OUTPUT"
      - run: npm install -g @anthropic-ai/claude-code
        if: steps.find.outputs.files != ''
      - name: Produce spec.md for each approved intent
        if: steps.find.outputs.files != ''
        env:
          {{cli_auth_env}}
        run: |
          for f in ${{ steps.find.outputs.files }}; do
            slug=$(grep -E '^slug:' "$f" | head -1 | sed 's/^slug:[[:space:]]*//; s/"//g'); [ -z "$slug" ] && slug=$(basename "$f" .md)
            [ -f "{{spec_dir}}/$slug.md" ] && { echo "{{spec_dir}}/$slug.md exists — skipping"; continue; }
            claude -p "Read the attached intent.md at $f and produce a requirements and design spec for integrating it into our existing codebase. Apply the skills available to you so the plan conforms to our brand guidelines, security policies and UX standards. Document the spec fully as {{spec_dir}}/$slug.md using the template {{spec_dir}}/TEMPLATE.md (frontmatter type: spec, slug: $slug, status: draft, links.intent: $f), ready to hand to the engineering team. Describe clearly any areas of concern, especially where you cannot satisfy contradicting policies, in the 'Flagged concerns' table with a policy owner per row." \
              --allowedTools "Read,Grep,Glob,Write({{spec_dir}}/*),Bash(git log *)" --max-turns 40 --output-format json --no-session-persistence > "spec-$slug.result.json"
          done
      - uses: peter-evans/create-pull-request@v6
        if: steps.find.outputs.files != ''
        with:
          branch: sdlc/spec-${{ github.run_id }}
          title: "spec: requirements & design for approved intent(s)"
          commit-message: "spec: generated from approved intent (Stage 2 pass)"
          committer: sdlc-spec <sdlc-spec@users.noreply.github.com>
          author: sdlc-spec <sdlc-spec@users.noreply.github.com>
          body: |
            Generated by the Stage 2 requirements & design pass with the organization's skills loaded.
            Product owner: review the spec against the intent — does it solve the stated problem, are the open questions
            answered or carried forward — and work through **Flagged concerns** first. Accepting this PR starts `/sdlc:plan`.
          add-paths: {{spec_dir}}/*.md
