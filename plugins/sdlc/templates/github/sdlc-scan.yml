# sdlc — Recurring codebase scan (playbook Stage 6). Self-hosted form: a scheduled, read-only security scan by Claude
# whose findings go through the same gates as any other change (issue → PR review, or intent.md for anything wider).
# Hosted form: Claude Security (Enterprise, public beta) — connect the repo in claude.ai admin settings, take the first
# scan as baseline, schedule weekly; then this workflow is optional. Secrets: ANTHROPIC_API_KEY (init.sh --auth api) or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (init.sh --auth oauth, subscription billing).
name: sdlc security scan
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: Scan (read-only)
        env:
          {{cli_auth_env}}
        run: |
          claude -p "Perform a security scan of this repository (read-only). Check: injection (SQL/command/template), missing or inconsistent authentication and authorization on external-facing endpoints, secrets or credentials in code and config, PII in logs or error messages, unsafe deserialization, path traversal, insecure defaults and misconfiguration, dependency red flags visible in manifests. For each finding give: file:line, severity (high/medium/low), confidence (high/medium/low) with the evidence you validated, and whether the fix fits in one PR. Do not report style. Write the report as markdown with a summary table first, then a 'Findings' section, then 'Suggested intent.md items' for anything wider than one PR." \
            --allowedTools "Read,Grep,Glob,Bash(git log *)" --max-turns 40 > scan-report.md
      - name: Open or update the scan issue
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          title="Security scan $(date -u +%F) (sdlc)"
          n=$(gh issue list --label sdlc-scan --state open --json number --jq '.[0].number' 2>/dev/null || true)
          gh label create sdlc-scan --description "recurring codebase scan" --color 5319e7 2>/dev/null || true
          if [ -n "$n" ]; then gh issue comment "$n" --body-file scan-report.md; else gh issue create --title "$title" --label sdlc-scan --body-file scan-report.md; fi
      - uses: actions/upload-artifact@v4
        with: { name: scan-report, path: scan-report.md }
