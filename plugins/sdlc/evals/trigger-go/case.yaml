schema_version: "1.1"
name: trigger-go
description: One concrete change, end to end up to the PR, must call sdlc:go (not the queue loop). Runs in a tiny adopted repository built by fixture.sh, because go is for adopted repositories.
tags: [trigger]
execution:
  max_turns: 4
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
