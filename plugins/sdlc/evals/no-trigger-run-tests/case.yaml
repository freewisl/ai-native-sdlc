schema_version: "1.1"
name: no-trigger-run-tests
description: A request to run the tests ("돌려") is not the loop — it must not call sdlc:run. Runs in the adopted repository of fixture.sh.
tags: [trigger, negative]
execution:
  max_turns: 4
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
